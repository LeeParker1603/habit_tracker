name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/docker-ci-cd ]
  pull_request:
    branches: [ main, develop, feature/docker-ci-cd ]


jobs:
  # 1. Этап ТЕСТЫ
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        env:
          SECRET_KEY: 'test_secret_key_for_ci_pipeline'
          DEBUG: 'True'
          DB_NAME: 'test_db'
        run: |
          python manage.py test

  # 2. Этап ЛИНТЕР (запускается после успешных тестов)
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # 3. Этап БИЛД и АВТО-ДЕПЛОЙ
  build_and_deploy:
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/docker-ci-cd' # Запуск деплоя при пуше в рабочую ветку
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в рабочую папку проекта на сервере
            mkdir -p /home/ubuntu/habit_tracker
            cd /home/ubuntu/habit_tracker

            # Если проекта еще нет на сервере — клонируем с точкой, если есть — подтягиваем изменения
            if [ ! -d ".git" ]; then
              rm -f .env
              git clone https://github.com/LeeParker1603/habit_tracker .
              git checkout feature/docker-ci-cd
            else
              git fetch --all
              git checkout feature/docker-ci-cd
              git reset --hard origin/feature/docker-ci-cd
            fi

            # Автоматическое формирование .env файла из GitHub Secrets на сервере
            cat << 'EOF' > .env
            SECRET_KEY='${{ secrets.SECRET_KEY }}'
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}

            # Подключение к PostgreSQL контейнеру
            HOST=db
            PORT=5432
            NAME=${{ secrets.NAME }}
            USER=${{ secrets.USER }}
            PASSWORD=${{ secrets.PASSWORD }}

            # Настройки для инициализации самого контейнера базы данных PostgreSQL
            POSTGRES_DB=${{ secrets.NAME }}
            POSTGRES_USER=${{ secrets.USER }}
            POSTGRES_PASSWORD=${{ secrets.PASSWORD }}

            # Настройки брокера Redis и Celery
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0

            # Настройки Телеграм
            TELEGRAM_PROXY=${{ secrets.TELEGRAM_PROXY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EOF

            # Перезапуск Docker-контейнеров одной командой с очисткой старых анонимных томов
            docker compose down -v
            docker compose up -d --build

            echo "Ожидание запуска базы данных..."
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U "${{ secrets.USER }}" -d "${{ secrets.NAME }}"; then
                echo "База данных готова к работе!"
                break
              fi
              echo "База данных еще инициализируется, ждем 1 секунду..."
              sleep 1
            done

            # Применение миграций и создание кастомной группы менеджеров внутри запущенного контейнера Django
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py create_manager_group